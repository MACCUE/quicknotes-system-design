<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main>
        <h1>QuickNotes Dashboard</h1>

        <!-- Load Notes Section -->
        <section>
            <button id="load-btn">Load notes</button>
            <p id="status"></p>
        </section>

        <!-- Create Note Form Section -->
        <section>
            <form id="note-form">
                <div>
                    <label for="title-input">Title:</label>
                    <input type="text" id="title-input" maxlength="100" required>
                </div>
                <div>
                    <label for="body-input">Body:</label>
                    <textarea id="body-input"></textarea>
                </div>
                <button type="submit" id="submit-btn">Submit Note</button>
            </form>
        </section>

        <!-- Notes List Section -->
        <section>
            <h2>My Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
